# Use together with compose.yaml. cloudflare.env contains only TUNNEL_TOKEN.
services:
  web:
    volumes:
      - ./nginx.tunnel.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
      tunnel:
        ipv4_address: 172.30.90.3

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    env_file: cloudflare.env
    mem_limit: 128m
    networks:
      tunnel:
        ipv4_address: 172.30.90.2
    depends_on:
      web:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tunnel:
    ipam:
      config:
        - subnet: 172.30.90.0/29
