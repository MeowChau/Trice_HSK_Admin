# This config is for compose.tunnel.yaml, whose connector has this static IP.
# Only that connector can supply the original client IP. Public ports stay closed.
set_real_ip_from 172.30.90.2;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map "$realip_remote_addr:$http_x_forwarded_proto" $trusted_scheme {
    default $scheme;
    "172.30.90.2:https" https;
    "172.30.90.2:http" http;
}

client_max_body_size 100m;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $trusted_scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 60s;

server {
    listen 8080 default_server;
    server_name admin.tricehsk.id.vn localhost 127.0.0.1;

    location /api/ {
        proxy_pass http://api:3001;
    }
    location /docs {
        proxy_pass http://api:3001;
    }
    location /socket.io/ {
        proxy_pass http://api:3001;
    }
    location = /health {
        proxy_pass http://api:3001/;
    }
    location / {
        proxy_pass http://admin:3000;
        proxy_buffering off;
    }
}

server {
    listen 8080;
    server_name api.tricehsk.id.vn;
    location = /health {
        proxy_pass http://api:3001/;
    }
    location / {
        proxy_pass http://api:3001;
    }
}
