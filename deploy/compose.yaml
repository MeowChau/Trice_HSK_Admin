name: tricehsk

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *service
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-tricehsk}
      POSTGRES_USER: ${DATABASE_USERNAME:-tricehsk}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run init-env.sh first}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    <<: *service
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  maildev:
    <<: *service
    # Internal test inbox; replace MAIL_* with a real SMTP provider before launch.
    build:
      context: ../backend
      dockerfile: maildev.Dockerfile
    ports:
      - "127.0.0.1:1080:1080"
    mem_limit: 128m

  api:
    <<: *service
    image: tricehsk-api:${RELEASE_TAG:-local}
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=640
      APP_PORT: "3001"
      APP_TRUST_PROXY: "1"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_SYNCHRONIZE: "false"
      REDIS_URL: redis://redis:6379/1
    volumes:
      - uploads:/app/files
    mem_limit: 896m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  admin:
    <<: *service
    image: tricehsk-admin:${RELEASE_TAG:-local}
    build:
      context: ../fe_admin/dashboard
      dockerfile: ../../deploy/admin.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/signin').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    <<: *service
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  uploads:
    name: ${UPLOADS_VOLUME_NAME:-tricehsk_uploads}
